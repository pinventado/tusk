name: Build and Publish TUSK Image

on:
  workflow_dispatch:
    inputs:
      image_owner:
        description: GHCR owner or organization
        required: false
        default: pinventado
      image_name:
        description: Image name in GHCR
        required: false
        default: 26-resolute-small-tusk
      ubuntu_codename:
        description: Ubuntu codename for the build
        required: false
        default: resolute

  push:
    tags:
      - "image-*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    env:
      IMAGE_OWNER: ${{ github.event.inputs.image_owner || github.repository_owner }}
      IMAGE_NAME: ${{ github.event.inputs.image_name || '26-resolute-small-tusk' }}
      UBUNTU_CODENAME: ${{ github.event.inputs.ubuntu_codename || 'resolute' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build compatibility wrapper
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_DIR="${RUNNER_TEMP}/tusk-build-bin"
          mkdir -p "${WRAPPER_DIR}"

          cat > "${WRAPPER_DIR}/sudo" <<'EOF'
          #!/bin/bash
          set -euo pipefail

          REAL_SUDO="/usr/bin/sudo"

          # Intercept:
          #
          #   sudo debootstrap DIST TARGET
          #
          # Include sudo because quickinstall.sh invokes sudo from inside
          # the chroot, and make packages writable by the Actions user.
          if [ "${1:-}" = "debootstrap" ]; then
            shift

            DIST="${1:?Missing Ubuntu distribution codename}"
            TARGET="${2:?Missing debootstrap target directory}"
            shift 2

            "${REAL_SUDO}" /usr/sbin/debootstrap \
              --include=sudo \
              "${DIST}" \
              "${TARGET}" \
              "$@"

            "${REAL_SUDO}" mkdir -p "${TARGET}/packages"
            "${REAL_SUDO}" chown \
              "$(id -u):$(id -g)" \
              "${TARGET}/packages"

            exit 0
          fi

          # mkdockerimage.sh tries to overwrite the source list created by
          # debootstrap with the runner's /etc/apt/sources.list.
          #
          # Ubuntu Actions runners use deb822 sources elsewhere, so that
          # replacement may contain no usable repository definitions.
          # Consume the incoming data but preserve debootstrap's valid file.
          if [ "${1:-}" = "tee" ] &&
             [ "${2:-}" = "etc/apt/sources.list" ]; then
            cat >/dev/null
            exit 0
          fi

          # Forward every other sudo command normally.
          exec "${REAL_SUDO}" "$@"
          EOF

          chmod +x "${WRAPPER_DIR}/sudo"
          echo "${WRAPPER_DIR}" >> "${GITHUB_PATH}"

      - name: Build and publish image
        env:
          SKIP_DOCKER_LOGIN: yes
        run: |
          set -euo pipefail
          ./mkdockerimage.sh "${UBUNTU_CODENAME}"
