name: Build and Publish TUSK Image

on:
  workflow_dispatch:
    inputs:
      image_owner:
        description: GHCR owner or organization
        required: false
        default: pinventado
      size:
        description: Image size to build
        required: false
        default: small
        type: choice
        options:
          - small
          - big
          - alpine
  push:
    tags:
      - "image-*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    env:
      IMAGE_OWNER: ${{ github.event.inputs.image_owner || github.repository_owner }}
      SIZE: ${{ github.event.inputs.size || 'small' }}
      MS_SKIP_DOCKER_PUSH: yes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          set -euo pipefail
          cd docker
          ./build_tusk_images.sh -x "${SIZE}"
