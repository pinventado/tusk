- name: Prepare build compatibility wrapper
  shell: bash
  run: |
    set -euo pipefail

    WRAPPER_DIR="${RUNNER_TEMP}/tusk-build-bin"
    mkdir -p "${WRAPPER_DIR}"

    cat > "${WRAPPER_DIR}/sudo" <<'EOF'
    #!/bin/bash
    set -euo pipefail

    REAL_SUDO="/usr/bin/sudo"

    if [ "${1:-}" = "debootstrap" ]; then
      shift

      DIST="${1:?Missing Ubuntu distribution codename}"
      TARGET="${2:?Missing debootstrap target directory}"
      shift 2

      "${REAL_SUDO}" /usr/sbin/debootstrap \
        --include=sudo \
        "${DIST}" \
        "${TARGET}" \
        "$@"

      # Add the Ubuntu components needed by packages.txt.
      cat <<APT_SOURCES | "${REAL_SUDO}" tee "${TARGET}/etc/apt/sources.list" >/dev/null
    deb http://archive.ubuntu.com/ubuntu ${DIST} main restricted universe multiverse
    deb http://archive.ubuntu.com/ubuntu ${DIST}-updates main restricted universe multiverse
    deb http://archive.ubuntu.com/ubuntu ${DIST}-backports main restricted universe multiverse
    deb http://security.ubuntu.com/ubuntu ${DIST}-security main restricted universe multiverse
    APT_SOURCES

      "${REAL_SUDO}" mkdir -p "${TARGET}/packages"
      "${REAL_SUDO}" chown \
        "$(id -u):$(id -g)" \
        "${TARGET}/packages"

      exit 0
    fi

    # Preserve the source list created above when mkdockerimage.sh tries
    # to replace it with the GitHub runner's source list.
    if [ "${1:-}" = "tee" ] &&
       [ "${2:-}" = "etc/apt/sources.list" ]; then
      cat >/dev/null
      exit 0
    fi

    exec "${REAL_SUDO}" "$@"
    EOF

    chmod +x "${WRAPPER_DIR}/sudo"
    echo "${WRAPPER_DIR}" >> "${GITHUB_PATH}"
